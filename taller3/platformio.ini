; PlatformIO Project Configuration File — Taller 3: Bluetooth (Objetivo I)
;
;   Dos ESP32 DevKit V1: la sensora (DHT22, HC-SR04, LDR y MQ-5, servidor BLE)
;   y la controladora (cliente BLE, consola y LED de alarma).

[platformio]
; Los puertos de cada placa son propios de cada máquina, así que viven en
; platformio_local.ini (ignorado por git). Si el archivo no existe,
; PlatformIO lo ignora y autodetecta el puerto.
extra_configs = platformio_local.ini

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I src/obj1/comun
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3

[env:sensora]
build_src_filter = +<obj1/sensora/>
lib_deps =
  ${env.lib_deps}
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14

[env:controlador]
build_src_filter = +<obj1/controlador/>
