[env:servicio2]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<servicio2/>
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  duinowitchery/hd44780@^1.3.2

[env:servicio3]
extends = env:servicio2
build_src_filter = +<servicio3/>

[env:servicio4]
extends = env:servicio2
build_src_filter = +<servicio4/>
