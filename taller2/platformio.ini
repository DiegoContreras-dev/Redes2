; PlatformIO Project Configuration File — Taller 2: Comunicación Serial
;
;   Dos Arduino UNO físicos: estación remota (sensores + LED RGB)
;   y estación controladora (lee teclado, envía umbrales, muestra datos).
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Los puertos de cada placa son propios de cada máquina, así que viven en
; platformio_local.ini (ignorado por git). Copia platformio_local.ini.example
; y pon ahí los tuyos. Si el archivo no existe, PlatformIO lo ignora y
; autodetecta el puerto.
extra_configs = platformio_local.ini

[env:remoto]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = +<*> -<controlador/> -<prueba_dht/>
check_src_filters = +<src/remoto/>
check_skip_packages = yes
check_flags =
  cppcheck: --suppress=*:*/.pio/libdeps/*
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14

[env:controlador]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = +<*> -<remoto/> -<prueba_dht/>
check_src_filters = +<src/controlador/>
check_skip_packages = yes
check_flags =
  cppcheck: --suppress=*:*/.pio/libdeps/*
; lib_deps =
;   ejemplo: adafruit/DHT sensor library@^1.4.4

; Banco de pruebas aislado del DHT22: solo el sensor, sin SoftwareSerial ni el
; resto de perifericos, para descartar que algo mas le robe tiempo de CPU.
[env:prueba_dht]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = +<prueba_dht/>
check_src_filters = +<src/prueba_dht/>
check_skip_packages = yes
check_flags =
  cppcheck: --suppress=*:*/.pio/libdeps/*
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
