; PlatformIO Project Configuration File — Taller 2: Comunicación Serial
;
;   Dos Arduino UNO físicos: estación remota (sensores + LED RGB)
;   y estación controladora (lee teclado, envía umbrales, muestra datos).
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Los puertos de cada placa son propios de cada máquina, así que viven en
; platformio_local.ini (ignorado por git). Copia platformio_local.ini.example
; y pon ahí los tuyos. Si el archivo no existe, PlatformIO lo ignora y
; autodetecta el puerto.
extra_configs = platformio_local.ini

[env:remoto]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = +<*> -<controlador/>
check_src_filters = +<src/remoto/>
check_skip_packages = yes
check_flags =
  cppcheck: --suppress=*:*/.pio/libdeps/*
lib_deps =
  robtillaart/DHTlib@^0.1.38

[env:controlador]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = +<*> -<remoto/>
check_src_filters = +<src/controlador/>
check_skip_packages = yes
check_flags =
  cppcheck: --suppress=*:*/.pio/libdeps/*
; lib_deps =
;   ejemplo: adafruit/DHT sensor library@^1.4.4
